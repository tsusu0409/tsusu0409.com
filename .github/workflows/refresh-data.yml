name: Refresh external posts and Spotify

on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = JST 04:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch external posts (RSS)
        run: npm run data:posts

      # 失敗しても RSS の更新はコミットする（ジョブは失敗として残る）
      - name: Fetch Spotify playlists
        run: npm run data:spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/external-posts.json src/data/spotify-playlists.json
          git diff --cached --quiet || git commit -m "chore(data): refresh external posts and Spotify [skip actions]"
          git push
